version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: slm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slm-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLAMA_CPP_URL=http://llama-cpp:8080
      - VLLM_URL=http://vllm:8000
      - SLM_TEST_HOST=ollama
    # Note: vLLM listens on port 8000 inside container, mapped to 8100 on host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # NOTE: backend/benchmarks.py pins RESULTS_DIR to <module_dir>/results,
      # i.e. /app/results inside the image. Mount the canonical host folder
      # `./backend/results` here so the API exposes ALL runs (the older
      # mount `./results:/app/results` only surfaced the handful of files
      # written from the project root and hid the bulk of master files
      # accumulated under backend/results/).
      - ./backend/results:/app/results
      - ./scripts/tests:/app/scripts/tests
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G

  llama-cpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: llama-cpp
    ports:
      - "8080:8080"
    volumes:
      - llama_cpp_models:/models
    restart: unless-stopped
    profiles:
      - llama-cpp
    deploy:
      resources:
        limits:
          memory: 8G

  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    ports:
      - "8100:8000"
    volumes:
      - vllm_models:/root/.cache/huggingface
    restart: unless-stopped
    profiles:
      - vllm
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  ollama_data:
  llama_cpp_models:
  vllm_models: