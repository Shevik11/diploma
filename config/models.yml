# =============================================================================
# Model catalog for the SLM benchmarking pipeline.
#
# This file is the single source of truth for:
#   * which models the analysis pipeline knows about,
#   * how to translate a UI/test alias (e.g. ``llama-3.2-1b``) into the
#     canonical Ollama tag (``llama3.2:1b``),
#   * approximate model size, default quantization and minimum RAM at
#     1/2/4 CPU cores.
#
# Numbers come from the heuristics in ``backend/main.py`` (which were in turn
# calibrated against real benchmark runs in ``backend/results/``):
#   * RAM ≈ params(B) × 0.60 GB (Q4_K_M baseline) + 1.0 GB runtime overhead
#   * each extra worker thread adds ~150 MB to the working set.
# =============================================================================

# Default decoding parameters used by the test harness when an individual
# script does not override them.  Keeping them here makes runs reproducible
# across machines and across test runs.
defaults:
  temperature: 0.3
  seed: 42
  num_ctx: 4096
  # Used for performance benchmarks only — leave high enough so that
  # quality tests are not truncated.
  num_predict: 256

# Quantization size table (GB per billion parameters).  Mirrors the
# ``_QUANT_PER_B_GB`` map in backend/main.py so the analysis pipeline never
# disagrees with the backend feasibility check.
quant_size_gb_per_b:
  q2_k:   0.40
  q3_k_s: 0.45
  q3_k_m: 0.50
  q3_k_l: 0.55
  q4_0:   0.58
  q4_1:   0.62
  q4_k_s: 0.58
  q4_k_m: 0.60   # Ollama default
  q5_0:   0.70
  q5_1:   0.75
  q5_k_s: 0.70
  q5_k_m: 0.72
  q6_k:   0.85
  q8_0:   1.10
  fp16:   2.00
  bf16:   2.00
  fp32:   4.00

# Catalog: one entry per model exposed by the dashboard.
models:
  - id: phi-3-mini
    label: "Phi-3 Mini (3.8B)"
    ollama: phi3:mini
    family: phi
    params_b: 3.8
    quant: q4_k_m
    min_ram_gb_q4: 4
    notes: "Best per-token quality among <4B models, Microsoft."

  - id: llama-3.2-1b
    label: "Llama 3.2 (1B)"
    ollama: llama3.2:1b
    family: llama
    params_b: 1.0
    quant: q4_k_m
    min_ram_gb_q4: 2
    notes: "Smallest viable Llama; great for edge & mobile."

  - id: llama-3.2-3b
    label: "Llama 3.2 (3B)"
    ollama: llama3.2:3b
    family: llama
    params_b: 3.0
    quant: q4_k_m
    min_ram_gb_q4: 3
    notes: "Sweet spot for laptops with 8 GB RAM."

  - id: gemma-2b
    label: "Gemma 2B"
    ollama: gemma2:2b
    family: gemma
    params_b: 2.0
    quant: q4_k_m
    min_ram_gb_q4: 3
    notes: "Google small model; strong on reasoning per-B."

  - id: mistral-7b
    label: "Mistral 7B"
    ollama: mistral:7b
    family: mistral
    params_b: 7.0
    quant: q4_k_m
    min_ram_gb_q4: 6
    notes: "High-quality 7B reference; needs 8+ GB RAM."

  - id: qwen2.5:0.5b
    label: "Qwen 2.5 (0.5B)"
    ollama: qwen2.5:0.5b
    family: qwen
    params_b: 0.5
    quant: q4_k_m
    min_ram_gb_q4: 1
    notes: "Tiniest baseline; useful as 'lower bound'."

  - id: qwen2.5:1.5b
    label: "Qwen 2.5 (1.5B)"
    ollama: qwen2.5:1.5b
    family: qwen
    params_b: 1.5
    quant: q4_k_m
    min_ram_gb_q4: 2

  - id: qwen2.5:3b
    label: "Qwen 2.5 (3B)"
    ollama: qwen2.5:3b
    family: qwen
    params_b: 3.0
    quant: q4_k_m
    min_ram_gb_q4: 3

  - id: qwen2.5:7b
    label: "Qwen 2.5 (7B)"
    ollama: qwen2.5:7b
    family: qwen
    params_b: 7.0
    quant: q4_k_m
    min_ram_gb_q4: 6

  - id: qwen2.5-coder:1.5b
    label: "Qwen 2.5 Coder (1.5B)"
    ollama: qwen2.5-coder:1.5b
    family: qwen-coder
    params_b: 1.5
    quant: q4_k_m
    min_ram_gb_q4: 2
    notes: "Code-specialised; HumanEval-friendly."

  - id: qwen2.5-coder:7b
    label: "Qwen 2.5 Coder (7B)"
    ollama: qwen2.5-coder:7b
    family: qwen-coder
    params_b: 7.0
    quant: q4_k_m
    min_ram_gb_q4: 6
